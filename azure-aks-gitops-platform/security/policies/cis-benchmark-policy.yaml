# CIS Kubernetes Benchmark Level 2 — Pod Security Standards enforcement
# Enforces restricted pod security for all workload namespaces.
---
# Label all workload namespaces with restricted PSS to enforce CIS L2 controls:
#   - No privilege escalation
#   - No root containers
#   - Read-only root filesystem
#   - Drop all Linux capabilities
#   - Seccomp RuntimeDefault or Localhost
apiVersion: v1
kind: Namespace
metadata:
  name: myapp-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: myapp-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# OPA Gatekeeper constraint: require resource limits on all containers
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: require-resource-limits
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - argocd
      - monitoring
  parameters:
    limits:
      - cpu
      - memory
    requests:
      - cpu
      - memory
---
# OPA Gatekeeper constraint: disallow latest image tag
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowedTags
metadata:
  name: disallow-latest-tag
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
  parameters:
    tags:
      - latest
---
# OPA Gatekeeper constraint: require liveness and readiness probes
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredProbes
metadata:
  name: require-probes
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    excludedNamespaces:
      - kube-system
  parameters:
    probes:
      - livenessProbe
      - readinessProbe
    probeTypes:
      - tcpSocket
      - httpGet
      - exec
