apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform-managed applications across all environments

  sourceRepos:
    - "https://github.com/junaidabbas055/azure-aks-gitops-platform"
    - "https://charts.helm.sh/stable"
    - "https://prometheus-community.github.io/helm-charts"

  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: "networking.k8s.io"
      kind: Ingress
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "policy"
      kind: PodDisruptionBudget

  roles:
    - name: dev-deployer
      description: CI/CD pipeline role for dev environment
      policies:
        - p, proj:platform:dev-deployer, applications, sync, platform/*, allow
        - p, proj:platform:dev-deployer, applications, get, platform/*, allow
      jwtTokens: []

    - name: prod-deployer
      description: CI/CD pipeline role for prod environment (sync requires approval)
      policies:
        - p, proj:platform:prod-deployer, applications, get, platform/*, allow
      jwtTokens: []
