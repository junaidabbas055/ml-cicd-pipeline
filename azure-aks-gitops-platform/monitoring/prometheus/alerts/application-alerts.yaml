apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: application.availability
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (namespace, service)
            /
            sum(rate(http_requests_total[5m])) by (namespace, service)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High HTTP 5xx error rate on {{ $labels.namespace }}/{{ $labels.service }}"
            description: "Service {{ $labels.service }} in {{ $labels.namespace }} has a {{ $value | humanizePercentage }} error rate."

        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le, namespace, service)
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High P99 latency on {{ $labels.namespace }}/{{ $labels.service }}"
            description: "P99 latency for {{ $labels.service }} in {{ $labels.namespace }} is {{ $value | humanizeDuration }}."

        - alert: ServiceDown
          expr: up{job=~".*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "Prometheus target {{ $labels.job }} (instance {{ $labels.instance }}) is unreachable."

    - name: application.resources
      interval: 60s
      rules:
        - alert: ContainerCPUThrottling
          expr: |
            rate(container_cpu_cfs_throttled_seconds_total[5m])
            /
            rate(container_cpu_cfs_periods_total[5m])
            > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CPU throttling on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is being throttled {{ $value | humanizePercentage }} of the time."

        - alert: PersistentVolumeFillingUp
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PersistentVolume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is filling up"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 15% free space."
