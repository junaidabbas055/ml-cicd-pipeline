# kube-prometheus-stack Helm values for AKS
# Deploy: helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#           -n monitoring --create-namespace -f values.yaml

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "40GB"
    replicas: 2
    replicaExternalLabelName: prometheus_replica
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-premium
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 6Gi

alertmanager:
  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-premium
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "cluster", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "platform-slack"
      routes:
        - match:
            severity: critical
          receiver: "pagerduty-critical"
    receivers:
      - name: "platform-slack"
        slack_configs:
          - api_url: "$(SLACK_WEBHOOK_URL)"
            channel: "#platform-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Details:* {{ .Annotations.description }}
                *Namespace:* {{ .Labels.namespace }}
              {{ end }}
      - name: "pagerduty-critical"
        pagerduty_configs:
          - routing_key: "$(PAGERDUTY_ROUTING_KEY)"
            send_resolved: true

grafana:
  enabled: true
  replicas: 2
  adminPassword: "$(GRAFANA_ADMIN_PASSWORD)"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.example.com
  persistence:
    enabled: true
    storageClassName: managed-premium
    size: 10Gi
  grafana.ini:
    auth.azuread:
      enabled: true
      name: Azure AD
      allow_sign_up: true
      client_id: "$(AZURE_AD_CLIENT_ID)"
      client_secret: "$(AZURE_AD_CLIENT_SECRET)"
      scopes: openid email profile
      auth_url: https://login.microsoftonline.com/$(TENANT_ID)/oauth2/v2.0/authorize
      token_url: https://login.microsoftonline.com/$(TENANT_ID)/oauth2/v2.0/token
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
