---
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 4
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3
ssh_allowed_users: []

fail2ban_bantime: 3600
fail2ban_maxretry: 5
fail2ban_findtime: 600

disabled_services:
  - telnet
  - rsh
  - rlogin
  - rcp
  - ypbind
  - tftp
  - talk
  - ntalk
